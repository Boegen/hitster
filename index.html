<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR-Code Scanner & Hitster Downloads</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f8f9fa;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh; 
            margin: 0;
            position: relative; /* Wichtig für das Menü oben links */
        }

        /* --- NEU: Container für das Menü oben links --- */
        .top-menu-container {
            position: absolute;
            top: 15px;
            left: 15px;
            text-align: left;
            z-index: 1000; /* Damit das Menü immer über dem Scanner liegt */
        }

        /* Button oben links */
        #toggleMenuBtn {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
            width: auto; /* Überschreibt die 80% Breite der anderen Buttons */
            max-width: none;
        }

        #toggleMenuBtn:hover {
            background-color: #5a6268;
        }

        /* Das versteckte Download-Fenster */
        .download-section {
            display: none; /* Anfangs unsichtbar */
            margin-top: 10px;
            padding: 15px;
            background: white;
            border-radius: 10px;
            border: 2px solid #6c757d;
            box-shadow: 0px 4px 8px rgba(0,0,0,0.2); /* Leichter Schatten */
            width: 250px;
            box-sizing: border-box;
        }

        .download-section h3 {
            margin-top: 0;
            font-size: 1.1rem;
            color: #343a40;
            margin-bottom: 10px;
        }

        select {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
            background-color: #f8f9fa;
            cursor: pointer;
        }

        /* Hauptinhalt in der Mitte */
        h2 {
            color: #343a40;
            font-size: 5vw; 
            margin-bottom: 20px;
            margin-top: 60px; /* Etwas Platz nach oben wegen des Menüs */
        }
        #reader {
            width: 90%;
            max-width: 320px;
            margin-bottom: 20px;
            border: 2px solid #007bff;
            border-radius: 10px;
            padding: 10px;
            background: white;
        }
        p {
            font-size: 4vw; 
            color: #495057;
        }
        button {
            padding: 12px 24px;
            font-size: 4vw; 
            border: none;
            background-color: #007bff;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
            max-width: 250px;
            width: 80%;
        }
        button:hover {
            background-color: #0056b3;
        }

        #downloadBtn {
            background-color: #28a745; 
            width: 100%; /* Füllt das Menü in der Breite aus */
            font-size: 16px;
        }

        #downloadBtn:hover {
            background-color: #218838;
        }

        @media (min-width: 768px) {
            h2 { font-size: 24px; }
            p { font-size: 18px; }
            button { font-size: 18px; }
        }
    </style>
</head>
<body>

    <!-- --- Menü oben links --- -->
    <div class="top-menu-container">
        <button id="toggleMenuBtn" onclick="toggleDownloadMenu()">📥 Downloads</button>
        
        <div class="download-section" id="downloadMenu">
            <h3>🖨️ Karten laden</h3>
            <select id="pdfSelector">
            <option value="Anime_Hitster.pdf">Anime Edition</option>
            <option value=deutsches_Hitster.pdf">Deutsche Lieder Edition</option>
            <option value="deutsches_HitsterV2.pdf">Deutsche Lieder V2 Edition</option>
            <option value="nunos_Hitster.pdf">Nunos Edition</option>
            <option value="naims_Hitster.pdf">Naims Edition</option>
            <option value="malenas_Hitster.pdf">Malenas Edition</option>
            <option value="evas_Hitster.pdf">Evas Edition</option>
            <option value="Ulis_Hitster.pdf">Ulis Edition</option>
            </select>
            <button id="downloadBtn" onclick="downloadSelectedPdf()">📥 Herunterladen</button>
        </div>
    </div>

    <!-- --- Hauptseite (Scanner) --- -->
    <h2>🎵 QR-Code scannen und Song starten</h2>
    <div id="reader"></div>
    <p id="result">Scanne einen QR-Code...</p>
    <button id="scannerButton" onclick="toggleScanner()">📷 Scanner starten</button>

    <script>
        // --- Menü ein- und ausblenden ---
        function toggleDownloadMenu() {
            let menu = document.getElementById("downloadMenu");
            if (menu.style.display === "block") {
                menu.style.display = "none";
            } else {
                menu.style.display = "block";
            }
        }

        // --- PDF Download-Funktion ---
        function downloadSelectedPdf() {
            let selector = document.getElementById("pdfSelector");
            let selectedFile = selector.value;
            
            let link = document.createElement("a");
            link.href = selectedFile;
            link.download = selectedFile; 
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            // Optional: Menü nach dem Download wieder einklappen
            document.getElementById("downloadMenu").style.display = "none";
        }

        // --- Scanner-Funktionen (Unverändert) ---
        let scanner;
        let isScannerActive = false;

        function toggleScanner() {
            if (isScannerActive) {
                scanner.stop().then(() => {
                    document.getElementById("result").innerText = "Scanner gestoppt";
                    isScannerActive = false;
                    document.getElementById("scannerButton").innerText = "📷 Scanner starten";
                }).catch((err) => console.error("Fehler beim Stoppen des Scanners:", err));
            } else {
                startScanner();
                isScannerActive = true;
                document.getElementById("scannerButton").innerText = "🛑 Scanner stoppen";
            }
        }

        function startScanner() {
            scanner = new Html5Qrcode("reader");
            scanner.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: 250 },
                (decodedText) => {
                    document.getElementById("result").innerText = "Song gefunden: " + decodedText;
                    scanner.stop();
                    window.location.href = decodedText;
                },
                (errorMessage) => console.warn("Kein QR-Code erkannt:", errorMessage)
            ).catch(err => console.error("Fehler beim Starten des Scanners:", err));
        }
    </script>
</body>
</html>
