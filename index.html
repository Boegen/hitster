<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR-Code Scanner & Hitster Downloads</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f8f9fa;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h2 {
            color: #343a40;
            font-size: 5vw; 
            margin-bottom: 20px;
        }
        #reader {
            width: 90%;
            max-width: 320px;
            margin-bottom: 20px;
            border: 2px solid #007bff;
            border-radius: 10px;
            padding: 10px;
            background: white;
        }
        p {
            font-size: 4vw; 
            color: #495057;
        }
        button {
            padding: 12px 24px;
            font-size: 4vw; 
            border: none;
            background-color: #007bff;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
            max-width: 250px;
            width: 80%;
        }
        button:hover {
            background-color: #0056b3;
        }
        @media (min-width: 768px) {
            h2 { font-size: 24px; }
            p { font-size: 18px; }
            button { font-size: 18px; }
        }

        .download-section {
            margin-top: 30px;
            padding: 20px;
            background: white;
            border-radius: 10px;
            border: 2px solid #6c757d;
            width: 90%;
            max-width: 320px;
            box-sizing: border-box;
        }

        .download-section h3 {
            margin-top: 0;
            font-size: 1.2rem;
            color: #343a40;
        }

        select {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
            background-color: #f8f9fa;
            cursor: pointer;
        }

        #downloadBtn {
            background-color: #28a745; 
        }

        #downloadBtn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <h2>🎵 QR-Code scannen und Song starten</h2>
    <div id="reader"></div>
    <p id="result">Scanne einen QR-Code...</p>
    <button id="scannerButton" onclick="toggleScanner()">📷 Scanner starten</button>
    <div class="download-section">
        <h3>🖨️ Karten als PDF laden</h3>
        <select id="pdfSelector">
            <option value="Anime_Hitster.pdf">Anime Edition</option>
            <option value=deutsches_Hitster.pdf">Deutsche Lieder Edition</option>
            <option value="deutsches_HitsterV2.pdf">Deutsche Lieder V2 Edition</option>
            <option value="nunos_Hitster.pdf">Nunos Edition</option>
            <option value="naims_Hitster.pdf">Naims Edition</option>
            <option value="malenas_Hitster.pdf">Malenas Edition</option>
            <option value="evas_Hitster.pdf">Evas Edition</option>
            <option value="Ulis_Hitster.pdf">Ulis Edition</option>
        </select>
        <button id="downloadBtn" onclick="downloadSelectedPdf()">📥 Herunterladen</button>
    </div>

    <script>
        let scanner;
        let isScannerActive = false;

        function toggleScanner() {
            if (isScannerActive) {
                scanner.stop().then(() => {
                    document.getElementById("result").innerText = "Scanner gestoppt";
                    isScannerActive = false;
                    document.getElementById("scannerButton").innerText = "📷 Scanner starten";
                }).catch((err) => console.error("Fehler beim Stoppen des Scanners:", err));
            } else {
                startScanner();
                isScannerActive = true;
                document.getElementById("scannerButton").innerText = "🛑 Scanner stoppen";
            }
        }

        function startScanner() {
            scanner = new Html5Qrcode("reader");
            scanner.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: 250 },
                (decodedText) => {
                    document.getElementById("result").innerText = "Song gefunden: " + decodedText;
                    scanner.stop();
                    window.location.href = decodedText;
                },
                (errorMessage) => console.warn("Kein QR-Code erkannt:", errorMessage)
            ).catch(err => console.error("Fehler beim Starten des Scanners:", err));
        }

        function downloadSelectedPdf() {
            let selector = document.getElementById("pdfSelector");
            let selectedFile = selector.value;
            
            let link = document.createElement("a");
            link.href = selectedFile;
            link.download = selectedFile;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
